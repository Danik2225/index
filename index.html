<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Share Hub</title>
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(circle at center, #14120e 0%, #070605 100%); color: #fff; min-height: 100vh; padding-bottom: 90px; }
        .app-content { max-width: 800px; width: 100%; margin: 0 auto; padding: 15px; }
        .screen { display: none; animation: fadeIn 0.3s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        h2 { 
            font-size: 1.5rem; margin-bottom: 20px; font-weight: 700;
            background: linear-gradient(135deg, #ffe082 0%, #d4af37 50%, #a17f1a 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .group-list { display: flex; flex-direction: column; gap: 15px; }
        .group-card-btn { 
            background: linear-gradient(135deg, rgba(36, 32, 23, 0.7) 0%, rgba(18, 16, 12, 0.9) 100%);
            border: 1px solid #d4af37; border-radius: 16px; padding: 20px; text-align: left; cursor: pointer; width: 100%; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .group-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .group-name { font-size: 1.2rem; font-weight: bold; color: #f5d061; }
        .group-status { background: linear-gradient(135deg, #d4af37, #856404); color: #000; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; }

        .create-panel { background: rgba(20, 18, 14, 0.9); border: 1px solid #d4af37; border-radius: 16px; padding: 20px; }
        .form-input { width: 100%; background: #0e0d0a; border: 1px solid rgba(212,175,55,0.3); padding: 12px; color: white; border-radius: 10px; margin-bottom: 15px; outline: none; }

        .main-stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 16px; overflow: hidden; border: 2px solid #d4af37; }
        #remoteVideo { width: 100%; height: 100%; object-fit: contain; }

        .webcam-overlay { position: absolute; bottom: 15px; right: 15px; width: 100px; height: 100px; border-radius: 50%; border: 3px solid #f5d061; overflow: hidden; z-index: 10; }
        #localCameraView { width: 100%; height: 100%; object-fit: cover; }

        .controls-card { background: rgba(20, 18, 14, 0.9); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 16px; padding: 15px; margin-top: 15px; }
        .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        .btn { background: linear-gradient(135deg, #ffe082 0%, #d4af37 50%, #a17f1a 100%); color: #000; border: none; padding: 12px 18px; border-radius: 10px; font-weight: 800; cursor: pointer; flex: 1; }
        .btn-danger { background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; }

        /* Блок ссылки */
        .share-link-box { background: #1a1610; border: 1px dashed #d4af37; border-radius: 10px; padding: 12px; margin-bottom: 10px; font-size: 0.85rem; }
        .share-link-text { color: #ffe082; word-break: break-all; font-weight: bold; margin-bottom: 8px; }

        .mini-chat { background: #0e0d0a; border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 16px; height: 120px; display: flex; flex-direction: column; overflow: hidden; margin-top: 15px; }
        .chat-messages { flex: 1; padding: 12px; overflow-y: auto; font-size: 0.9rem; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: rgba(10, 9, 7, 0.95); border-top: 1px solid #d4af37; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #5a5343; background: none; border: none; cursor: pointer; font-size: 0.75rem; font-weight: bold; gap: 4px; }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
        .nav-item.active { color: #f5d061; }
        .nav-item.btn-create-master { width: 62px; height: 62px; background: linear-gradient(135deg, #ffe082 0%, #d4af37 40%, #a17f1a 100%); border-radius: 50%; margin-top: -25px; color: #000; }
        .nav-item.btn-create-master svg { fill: #000; width: 26px; height: 26px; }
    </style>
</head>
<body>

    <div class="app-content">
        <div id="screen-menu" class="screen active">
            <h2>Все группы</h2>
            <div class="group-list" id="custom-groups-container"></div>
        </div>

        <div id="screen-add-group" class="screen">
            <h2>Создать новую группу</h2>
            <div class="create-panel">
                <input type="text" id="new-group-name" class="form-input" placeholder="Название группы">
                <input type="text" id="new-group-desc" class="form-input" placeholder="Описание">
                <button class="btn" onclick="createNewGroupRow()">Подтвердить и сохранить</button>
            </div>
        </div>

        <div id="screen-stream-room" class="screen">
            <h2 id="active-room-title">Комната</h2>
            
            <div style="display: grid; grid-template-columns: 1fr; gap: 15px;">
                <div class="share-link-box">
                    <div>🔗 Отправь эту ссылку на другое устройство для входа:</div>
                    <div class="share-link-text" id="share-link-url">Генерация ссылки...</div>
                    <button class="btn" style="padding: 6px 12px; font-size: 0.8rem;" onclick="copyRoomLink()">Скопировать ссылку</button>
                </div>

                <div class="main-stage">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="webcam-overlay"><video id="localCameraView" autoplay playsinline muted></video></div>
                </div>

                <div class="controls-card">
                    <div class="btn-row">
                        <button class="btn" id="startShareBtn">Включить Экран + Микрофон</button>
                        <button class="btn btn-danger" id="stopShareBtn" style="display: none;">Остановить стрим</button>
                    </div>
                    <button class="btn" id="autoConnectBtn" style="width:100%; background: linear-gradient(135deg, #f5d061, #a17f1a);">Подключиться к стриму в этой комнате</button>
                </div>

                <div class="mini-chat"><div class="chat-messages" id="chatMsgs"></div></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" id="tab-menu" onclick="switchTab('screen-menu', this)"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Menu</span></button>
        <button class="nav-item btn-create-master" onclick="switchTab('screen-add-group', this)"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
    </nav>

    <script>
        let groups = JSON.parse(localStorage.getItem('saved_cyber_groups')) || [
            { name: "Main Cyber Team", desc: "Главная секретная комната связи." }
        ];

        let peer = null, combinedStream = null, selectedRoomName = "";
        const localCameraView = document.getElementById('localCameraView');
        const remoteVideo = document.getElementById('remoteVideo');

        function renderGroupsList() {
            const container = document.getElementById('custom-groups-container');
            container.innerHTML = "";
            groups.forEach((group) => {
                const btn = document.createElement('button');
                btn.className = 'group-card-btn';
                btn.setAttribute('onclick', `openStreamRoom("${group.name}")`);
                btn.innerHTML = `
                    <div class="group-header">
                        <div class="group-name">${group.name}</div>
                        <div class="group-status">Войти</div>
                    </div>
                    <p style="font-size:0.85rem; color:#b5ad9e;">${group.desc}</p>
                `;
                container.appendChild(btn);
            });
        }

        function createNewGroupRow() {
            const nameInput = document.getElementById('new-group-name');
            const descInput = document.getElementById('new-group-desc');
            if (!nameInput.value.trim()) return;

            groups.push({ name: nameInput.value.trim(), desc: descInput.value.trim() || "Приватная комната." });
            localStorage.setItem('saved_cyber_groups', JSON.stringify(groups));
            renderGroupsList();

            nameInput.value = ""; descInput.value = "";
            switchTab('screen-menu', document.getElementById('tab-menu'));
        }

        function openStreamRoom(groupName) {
            selectedRoomName = groupName;
            document.getElementById('active-room-title').textContent = "Группа: " + groupName;
            
            // Генерируем ссылку для обмена
            let cleanId = encodeURIComponent(groupName.trim().toLowerCase());
            let shareUrl = window.location.origin + window.location.pathname + "?room=" + cleanId;
            document.getElementById('share-link-url').textContent = shareUrl;

            if(peer) { peer.destroy(); }
            peer = new Peer(cleanId + '-host'); 

            peer.on('call', call => {
                call.answer(combinedStream);
                call.on('stream', rStream => remoteVideo.srcObject = rStream);
            });

            switchTab('screen-stream-room', null);
        }

        function copyRoomLink() {
            let linkText = document.getElementById('share-link-url').textContent;
            navigator.clipboard.writeText(linkText);
            alert("Ссылка скопирована! Перешли её на другое устройство.");
        }

        // ПРОВЕРКА: Если зашли по ссылке извне
        window.addEventListener('load', () => {
            renderGroupsList();
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) {
                let decodedName = decodeURIComponent(roomParam);
                // Проверяем, есть ли такая группа в списке, если нет - добавляем
                if (!groups.some(g => g.name.toLowerCase() === decodedName.toLowerCase())) {
                    groups.push({ name: decodedName, desc: "Переход по прямой ссылке." });
                    localStorage.setItem('saved_cyber_groups', JSON.stringify(groups));
                    renderGroupsList();
                }
                openStreamRoom(decodedName);
            }
        });

        document.getElementById('autoConnectBtn').addEventListener('click', () => {
            let cleanId = encodeURIComponent(selectedRoomName.trim().toLowerCase());
            let fake = new MediaStream();
            let call = peer.call(cleanId + '-host', combinedStream || fake);
            call.on('stream', rStream => remoteVideo.srcObject = rStream);
        });

        document.getElementById('startShareBtn').addEventListener('click', async () => {
            try {
                const cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localCameraView.srcObject = cameraStream;
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                combinedStream = new MediaStream();
                combinedStream.addTrack(screenStream.getVideoTracks()[0]);
                combinedStream.addTrack(cameraStream.getAudioTracks()[0]); 
                document.getElementById('startShareBtn').style.display = 'none';
                document.getElementById('stopShareBtn').style.display = 'block';
            } catch (err) { console.error(err); }
        });

        function switchTab(screenId, btn) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if(btn) btn.classList.add('active');
        }
    </script>
</body>
</html>
